<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Practice Lab</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><section class="panel" id="login-panel"><p class="eyebrow">GitHub Actions + Playwright</p><h1>QA Practice Lab</h1><p class="muted">Sign in to manage your daily tasks.</p><form id="login-form" novalidate><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="qa@example.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter password" required><p id="login-error" role="alert" hidden></p><button type="submit">Log in</button></form><p class="hint">Demo account: qa@example.com / Password123!</p></section><section class="panel" id="tasks-panel" hidden><div class="top"><div><p class="eyebrow">YOUR WORKSPACE</p><h1>My Tasks</h1></div><button class="secondary" id="logout" type="button">Log out</button></div><p class="muted" id="welcome">Welcome!</p><form id="task-form"><label for="task-input">New task</label><div class="input-row"><input id="task-input" placeholder="e.g. Test checkout flow" maxlength="100" required><button type="submit">Add task</button></div><p id="task-error" role="alert" hidden></p></form><div class="stats"><span id="total-count">0 tasks</span><span id="completed-count">0 completed</span></div><ul id="task-list" aria-label="Tasks"></ul><p class="muted" id="empty-state">No tasks yet. Add your first task.</p></section></main><script src="/app.js"></script></body></html>
